<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#123a63" />
    <meta name="description" content="Secure voice note capture" />
    <meta http-equiv="Permissions-Policy" content="microphone=(self)" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Voice capture</title>
  </head>
  <body>
    <main class="app-shell">
      <header>
        <p class="eyebrow">Voice Smart Capture</p>
        <h1>Record a voice note</h1>
        <p class="intro">Record up to five minutes. Review it before securely uploading.</p>
      </header>

      <noscript><p class="message error">JavaScript is required to record audio.</p></noscript>
      <section class="recorder-card" aria-labelledby="recording-status">
        <p id="recording-status" class="status" role="status" aria-live="polite">Preparing recorder…</p>
        <p id="session-error" class="message error" role="alert" hidden></p>

        <div class="timer" aria-label="Recording duration">
          <output id="elapsed-time">0:00</output>
          <span>/ 5:00</span>
        </div>

        <div class="actions">
          <button id="record-button" class="primary" type="button" disabled>Start recording</button>
          <button id="stop-button" type="button" disabled>Stop recording</button>
        </div>

        <section id="review-panel" class="review" aria-label="Review recording" hidden>
          <audio id="audio-playback" controls preload="metadata"></audio>
          <p id="recording-details" class="details"></p>
          <div class="actions">
            <button id="rerecord-button" type="button">Re-record</button>
            <button id="upload-button" class="primary" type="button">Upload recording</button>
          </div>
        </section>
      </section>

      <p id="upload-error" class="message error" role="alert" hidden></p>
      <section id="success-panel" class="message success" aria-live="polite" hidden>
        <h2>Upload received</h2>
        <p>Your voice note is being processed. You may close this page.</p>
      </section>
      <p class="privacy-note">Audio stays on this device until you select “Upload recording.”</p>
    </main>
    <script src="./app.js" defer></script>
  </body>
</html>
